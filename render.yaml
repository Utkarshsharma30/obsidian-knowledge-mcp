services:
  - type: web
    name: obsidian-knowledge-mcp
    runtime: python
    plan: free
    buildCommand: pip install .
    startCommand: obsidian-mcp
    envVars:
      - key: MCP_SERVER_HOST
        value: 0.0.0.0
      - key: MCP_PUBLIC_URL
        value: https://obsidian-knowledge-mcp.onrender.com
      - key: MCP_AUTH_TOKEN
        generateValue: true
      - key: DATABASE_URL
        sync: false